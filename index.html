<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EA Suys Structural Tools</title>
  <meta name="description" content="Indicative EC5 and EC6 structural calculation tools by EA Suys.">
  <meta name="robots" content="index, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://www.easuys.be/favicon.ico" sizes="any">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="brand">
        <img class="logo" src="https://www.easuys.be/images/logo.jpg" alt="EA Suys logo">
        <div>
          <div class="brand-name">EA Suys</div>
          <div class="brand-tagline">Structural tools</div>
        </div>
      </div>
      <nav class="lang-switch" aria-label="Languages">
        <a href="#nl" data-lang="nl">NL</a>
        <a href="#en" data-lang="en" aria-current="page">EN</a>
        <a href="#fr" data-lang="fr">FR</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>EA Suys Structural Tools</h1>
        <p>Indicative EC5 and EC6 calculation records for early structural engineering checks.</p>
        <div class="hero-meta" aria-label="Current tool scope">
          <span>EC5 timber</span>
          <span>EC6 masonry</span>
          <span>JSON records</span>
        </div>
      </section>

      <section class="tool-shell" aria-label="Structural calculators">
        <aside class="tool-nav" aria-label="Calculators" data-tool-tabs></aside>
        <section class="workspace">
          <header class="workspace-header">
            <p class="eyebrow">Calculator</p>
            <h2 data-tool-title>EA Suys Structural Tools</h2>
            <p data-tool-status>Indicative calculation record.</p>
          </header>

          <div class="tool-grid">
            <form class="calculator" data-calculator-form>
              <div class="friendly-form" data-friendly-form hidden></div>
              <label for="json-input" data-input-label>Input JSON</label>
              <textarea id="json-input" data-json-input spellcheck="false"></textarea>
              <div class="actions">
                <button type="submit" class="primary" data-calculate>Calculate</button>
                <button type="button" data-save>Save</button>
                <button type="button" data-load>Load</button>
              </div>
            </form>

            <section class="result-panel" aria-live="polite">
              <h2 data-result-heading>Result</h2>
              <div class="result-summary" data-result-summary hidden></div>
              <div class="actions result-actions">
                <button type="button" data-download disabled>Download JSON</button>
                <button type="button" data-print>Print</button>
              </div>
              <pre data-result-output>{}</pre>
            </section>
          </div>
        </section>
      </section>
    </main>

    <footer class="footer">
      <div>EA Suys Structural Tools</div>
      <div><a href="https://www.easuys.be/index-en.html">EA Suys bv</a></div>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
